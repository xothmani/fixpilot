[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixpilot"
version = "0.1.0"
description = "Bug fixer agent with RAG, measured on a planted-bug benchmark"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fixpilot = "fixpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]

[tool.ruff]
line-length = 100
extend-exclude = ["benchmark"]

[tool.ruff.lint]
ignore = ["PYI034"]
